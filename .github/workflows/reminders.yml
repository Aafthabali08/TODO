# Optional: triggers the reminder job every hour, so users in every timezone get their
# email shortly after 8 PM local time. Vercel's free cron (vercel.json) runs once a day.
# To use it, add repository secrets APP_URL (e.g. https://your-app.vercel.app) and CRON_SECRET
# under Settings → Secrets and variables → Actions. Until then it skips without failing.
name: Dayform 8 PM reminders
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the reminder job
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET secret not set; skipping."
            exit 0
          fi
          curl --fail-with-body -sS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/daily-reminders"
